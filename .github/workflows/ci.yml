name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook regression suite
        run: tests/hooks-test.sh
      # The suite's most delicate constraint is bash 3.2 (macOS ships it), and this
      # container is how the whole harness has been verifying it. It carries neither
      # git nor jq, so the cases behind those two tools do not run here. HOW MANY is
      # the gap between the two steps' `passed:` lines, never a literal written down
      # here that the next case added would rot; how many LINES stand for them is
      # this step's own `skipped:` — one for the whole git-layer block and one for
      # the whole worktree-teardown block, two for the reader-parity cases that need
      # a second reader, and one for the case whose only judge is a strict parser.
      - name: Hook regression suite on bash 3.2
        run: docker run --rm -v "$PWD":/repo -w /repo bash:3.2 bash tests/hooks-test.sh
      # `grep -q '^passed:'` alone is a summary line printed over a screen of
      # failures: it goes green the moment the script reaches its own last line,
      # whatever it printed above that. Against a fixture HOME the install checks
      # fail legitimately — no authenticated CLI (this step runs before the CLI is
      # even installed), no MCPs, no ~/.claude — so the script exits 1 by design;
      # `failed: 0` is therefore unreachable here (measured: today's fixture reads
      # `passed: 2, failed: 8`), but two checks owe nothing to that missing
      # install and pass here every run — legacy artifacts removed, no CR bytes
      # shipped — so pinning `failed` at 8 gives the assertion real signal:
      # either one breaking moves the number and turns this step red, which
      # `grep -q` alone cannot do, since a fixture that already fails 8 checks
      # reads identical whether it fails 8 or 9. A substitution that dies under
      # `set -euo pipefail` still emits no `passed:` line at all, which is the
      # class the plain grep already guarded and still does, first. Bump the
      # pinned number only when a check legitimately joins or leaves this set —
      # never to wave off a real one.
      # OSO_VERIFY_SKIP_SLOW drops the two checks that would re-run the suite
      # this job already ran above and fetch impeccable from npm on every CI run.
      - name: Verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SLOW: 1
        run: |
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "8" ]
      # Same shape as the step above, with one real difference: this job never
      # installs the codex CLI, so every local check here needs an install that
      # never happened and fails for that reason alone — measured, today's
      # fixture reads `passed: 0, failed: 14`, the entire local suite (the
      # authenticated smoke below is skipped, not failed, so it never joins the
      # tally). There is no check left that owes nothing to an install, so unlike
      # verify.sh above this cannot floor on a nonzero `passed`; pinning `failed`
      # to 14 is the only assertion this fixture can bear, and it still catches
      # drift — a check that starts passing, one that stops running, or a new one
      # that joins all move the number away from 14. Installing codex here so a
      # real floor exists, the way verify.sh's own two install-independent checks
      # do, is a real option this step does not take: it would cost this job a
      # network dependency the sibling step is deliberately free of, on the same
      # reasoning that keeps the sibling step running before any CLI is
      # installed. OSO_VERIFY_SKIP_SMOKE skips the authenticated codex exec smoke,
      # which needs a logged-in CLI this job never has either.
      - name: Codex verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SMOKE: 1
        run: |
          report="$(mktemp)"
          fixture_home="$(mktemp -d)"
          HOME="$fixture_home" CODEX_HOME="$fixture_home/.codex" \
            bash bootstrap/verify-codex.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "14" ]
      - name: Shell script syntax
        run: |
          bash -n bootstrap/install.sh bootstrap/install-codex.sh bootstrap/purge-codex.sh bootstrap/verify.sh bootstrap/verify-codex.sh
          bash -n bootstrap/lib/codex-managed-config.sh bootstrap/lib/mount-impeccable.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/hooks-test.sh tests/plugin-lint.sh tests/fixtures/crashing-hook.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        run: claude plugin validate --strict plugin
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # windows-latest already ships jq: the last green run's `-CiMode` step logged
      # `jq already present` and installed nothing, so the suite exercises the jq
      # reader — the one the hooks use in production — on this platform as it stands.
      # This step is the guard for the day an image drops it, hence the `command -v`
      # check that makes it a no-op today. install.ps1 provisions jq too, but it is
      # the last step here and a winget PATH entry would not reach these earlier
      # `shell: bash` steps anyway: install.sh documents that winget installs join
      # PATH only in a new shell, and the ps1's registry refresh applies to its own
      # process.
      - name: Provision jq for the suite
        shell: bash
        run: |
          command -v jq >/dev/null 2>&1 || choco install jq --no-progress -y
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          jq --version
      - name: Hook regression suite
        shell: bash
        run: |
          jq --version
          bash tests/hooks-test.sh
      - name: Shell script syntax
        shell: bash
        run: |
          bash -n bootstrap/install.sh bootstrap/install-codex.sh bootstrap/purge-codex.sh bootstrap/verify.sh bootstrap/verify-codex.sh
          bash -n bootstrap/lib/codex-managed-config.sh bootstrap/lib/mount-impeccable.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/hooks-test.sh tests/plugin-lint.sh tests/fixtures/crashing-hook.sh
      - name: Bootstrapper (CI-safe mode)
        shell: powershell
        run: .\bootstrap\install.ps1 -CiMode
