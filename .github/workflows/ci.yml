name: ci

on:
  push:
    branches: [main]
  pull_request:

# The checks bootstrap/verify.sh reaches a verdict on against a fixture HOME —
# pinned as a SET, because the failure count alone cannot carry the assertion
# (see the step that reads it). Both jobs read these: the fixture is the same
# empty tree on either runner, so the only difference is which checks that
# runner's OS lets the script get to at all. A `note:` line never appears here —
# it is not a check and moves neither half of the tally — so an entry leaving
# this list is either a check deleted or a check demoted to a note, and both are
# decisions, not drift.
env:
  VERIFY_CHECK_NAMES: |
    oso-code plugin installed
    engram MCP connected
    context7 MCP connected
    fallow MCP connected
    legacy artifacts removed
    settings.json free of gentle hooks
    CLAUDE.md under budget
    plugin install path found
    OSO_STATE_BIN round-trips oso-state (e2e)
    impeccable plugin installed
    shipped executables carry no CR bytes
  # The two that only a Windows runner reaches: off Windows there is no
  # %USERPROFILE% for $HOME to disagree with and no second PATH for the client to
  # resolve a bare `engram` against, so verify.sh reports both as notes rather
  # than as checks that could only ever pass vacuously.
  VERIFY_CHECK_NAMES_WINDOWS: |
    home dir the Windows client reads
    engram binary the client resolves and runs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook regression suite
        run: tests/hooks-test.sh
      # The suite's most delicate constraint is bash 3.2 (macOS ships it), and this
      # container is how the whole harness has been verifying it. It carries neither
      # git nor jq, so the cases behind those two tools do not run here. HOW MANY is
      # the gap between the two steps' `passed:` lines, never a literal written down
      # here that the next case added would rot; how many LINES stand for them is
      # this step's own `skipped:` — one line per block or case that declares its
      # own reason for standing down, so that number moves with every such case
      # added and is no more written down here than the first one is.
      - name: Hook regression suite on bash 3.2
        run: docker run --rm -v "$PWD":/repo -w /repo bash:3.2 bash tests/hooks-test.sh
      # `grep -q '^passed:'` alone is a summary line printed over a screen of
      # failures: it goes green the moment the script reaches its own last line,
      # whatever it printed above that. Against a fixture HOME the install checks
      # fail legitimately — no authenticated CLI (this step runs before the CLI is
      # even installed), no MCPs, no ~/.claude — so the script exits 1 by design and
      # `failed: 0` is unreachable here. Two checks owe nothing to that missing
      # install and pass every run — legacy artifacts removed, no CR bytes shipped —
      # which is what gives the count signal at all: either one breaking moves it.
      # What the count cannot say is WHICH nine. Every other check fails here by
      # construction, so `failed: 9` reads identical whether a check was dropped,
      # renamed, or quietly stopped running — and it has already hidden exactly
      # that: `plugin install path found (oso-state)` left the report and
      # `OSO_STATE_BIN round-trips oso-state (e2e)` took its place at the same
      # total, and nothing here recorded either (D6). So the SET of names is pinned
      # beside the count, in $VERIFY_CHECK_NAMES at the top of this file: a check
      # joining or leaving is a one-line diff in the commit that causes it, and the
      # count keeps catching one that flips verdict under an unchanged name. Both
      # move only on a decision — never to wave off a real failure. A substitution
      # that dies under `set -euo pipefail` emits no `passed:` line at all, which is
      # the class the plain grep guards, and it still guards it first.
      # OSO_VERIFY_SKIP_SLOW drops the two checks that would re-run the suite
      # this job already ran above and fetch impeccable from npm on every CI run.
      - name: Verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SLOW: 1
        run: |
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          printf '%s' "$VERIFY_CHECK_NAMES" | LC_ALL=C sort > "$report.pinned"
          bash tools/verify-check-names.sh "$report" > "$report.reached"
          diff "$report.pinned" "$report.reached"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "9" ]
      # Same shape as the step above, with one real difference: this job never
      # installs the codex CLI, so almost every local check here needs an
      # install that never happened and fails for that reason alone — measured,
      # today's fixture reads `passed: 1, failed: 14` (the entire local suite;
      # the authenticated smoke below is skipped, not failed, so it never joins
      # the tally). ADR-0120 adds the one exception: its MCP-tool-table
      # agreement check compares tools/hook-gates.txt against its own
      # hardcoded mandated-tool list, needs neither a server nor a config.toml,
      # and passes here every run; the live per-server half of that same
      # decision needs an MCP server this job does not have, so it skips
      # rather than joining the tally (D2, ADR-0120) — which is why `failed`
      # stayed at 14 even though a new check legitimately joined the set. One
      # install-independent check is not the floor verify.sh's own two give
      # it, so unlike verify.sh above this still cannot floor on a nonzero
      # `passed`; pinning `failed` to 14 is still the only assertion this
      # fixture can bear, and it still catches drift — a check that starts
      # passing, one that stops running, or a new one that joins all move the
      # number away from 14. Installing codex here so a real floor exists, the
      # way verify.sh's own two install-independent checks do, is a real
      # option this step does not take: it would cost this job a network
      # dependency the sibling step is deliberately free of, on the same
      # reasoning that keeps the sibling step running before any CLI is
      # installed. OSO_VERIFY_SKIP_SMOKE skips the authenticated codex exec smoke,
      # which needs a logged-in CLI this job never has either.
      - name: Codex verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SMOKE: 1
        run: |
          report="$(mktemp)"
          fixture_home="$(mktemp -d)"
          HOME="$fixture_home" CODEX_HOME="$fixture_home/.codex" \
            bash bootstrap/verify-codex.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "14" ]
      # A hand-enumerated list is honest only until the next script lands
      # beside it unnamed — this same release already needed a guard to keep
      # three separate rule-count surfaces in sync by hand, and a fourth
      # surface of that shape is the same defect again, not a new one. Every
      # directory that holds a .sh file globs instead, so the list is
      # exhaustive by construction and never rots; only the two
      # extension-less singletons stay named, since a glob there would
      # assume every future file dropped into bin/ or git-hooks/ is a shell
      # script.
      - name: Shell script syntax
        run: |
          bash -n bootstrap/*.sh
          bash -n bootstrap/lib/*.sh
          bash -n tools/*.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/*.sh tests/fixtures/*.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        run: claude plugin validate --strict plugin
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # install.ps1 refuses to install below Node 22 and this job is the only
      # thing that exercises that refusal's other side. Unpinned it never did:
      # the runner image carries whatever LTS is current (24, then 26), so the
      # floor was tested against a version far above it and a floor raised past
      # what the prerequisite check actually accepts would still read green here.
      # Pinned AT the floor, this job tests the version an operator is allowed to
      # be on rather than the one the image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # windows-latest already ships jq: the last green run's `-CiMode` step logged
      # `jq already present` and installed nothing, so the suite exercises the jq
      # reader — the one the hooks use in production — on this platform as it stands.
      # This step is the guard for the day an image drops it, hence the `command -v`
      # check that makes it a no-op today. install.ps1 provisions jq too, but it is
      # the last step here and a winget PATH entry would not reach these earlier
      # `shell: bash` steps anyway: install.sh documents that winget installs join
      # PATH only in a new shell, and the ps1's registry refresh applies to its own
      # process.
      - name: Provision jq for the suite
        shell: bash
        run: |
          command -v jq >/dev/null 2>&1 || choco install jq --no-progress -y
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          jq --version
      - name: Hook regression suite
        shell: bash
        run: |
          jq --version
          bash tests/hooks-test.sh
      # Same list as the ubuntu job's own Shell script syntax step — globbed
      # for the same reason: see the comment there.
      - name: Shell script syntax
        shell: bash
        run: |
          bash -n bootstrap/*.sh
          bash -n bootstrap/lib/*.sh
          bash -n tools/*.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/*.sh tests/fixtures/*.sh
      # `bash -n` covers every shell script in the repo and no .ps1, so the one
      # file a Windows operator actually starts from had no static check at all.
      # It has shipped two parse bugs of exactly the kind this catches: a BOM-less
      # file read as ANSI, where an em-dash byte parses as a curly quote
      # (bb4356f), and a child command PowerShell 5.1 would not accept as written
      # (88f0c1e). The language parser is what PowerShell reads a script with
      # anyway and needs no module installed, so this stays as dependency-free as
      # the `bash -n` steps above; `shell: powershell` is 5.1, which is the
      # version whose reading of the file is the one that has been wrong.
      - name: PowerShell script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path .\bootstrap\install.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses clean ($($tokens.Count) tokens)"
      # Every forwardable flag, because forwarding is what this step asserts:
      # -CiMode delegates through Invoke-Installer to a stub that records its
      # argv, and with no flags passed there is nothing to get wrong. -Yes has a
      # second job here — it is what keeps a winget install that fails on the
      # runner from stopping at a consent prompt nobody is there to answer. The
      # runner must carry the prerequisites install.ps1 now enforces (git, jq,
      # Git Bash, Node at the floor); `claude` is the one it exempts in CI mode,
      # since this job deliberately never installs it.
      - name: Bootstrapper (CI-safe mode)
        shell: powershell
        run: .\bootstrap\install.ps1 -CiMode -Yes -ReplaceClaudeMd -NoImpeccable -NoGitHook
      # Same shape and same reasoning as the ubuntu job's own verify step — see
      # the comment there — with the two differences a Windows runner makes. The
      # name set gains $VERIFY_CHECK_NAMES_WINDOWS, the two checks that are notes
      # off Windows, and the count goes up by exactly those two: %USERPROFILE% and
      # the fixture HOME name different trees by construction, and no engram sits
      # on the persisted PATH this runner carries. Until this step existed the only
      # thing that ever ran verify.sh was the ubuntu job, so every Windows-only
      # branch in it — the PATH the client reads, the home dir it opens, the Git
      # Bash it spawns hooks through — shipped with no runner having executed it.
      - name: Verify report reaches its summary
        shell: bash
        env:
          OSO_VERIFY_SKIP_SLOW: 1
        run: |
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          printf '%s%s' "$VERIFY_CHECK_NAMES" "$VERIFY_CHECK_NAMES_WINDOWS" |
            LC_ALL=C sort > "$report.pinned"
          bash tools/verify-check-names.sh "$report" > "$report.reached"
          diff "$report.pinned" "$report.reached"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "11" ]
      # The double-clickable verifier as cmd runs it — the only gate there can be
      # on a .bat: no shell the regression suite runs under executes one, and the
      # PowerShell parser above reads .ps1 only. HOME is seeded with a decoy
      # because the runner's own already equals %USERPROFILE%, so an unpinned run
      # would look identical to a pinned one; verify.sh's home-dir check reads the
      # verdict back and goes red on the decoy the moment the .bat stops setting
      # HOME. The report is expected to end non-zero here (this runner has no
      # install), so the two LINES are the assertion and never the exit code —
      # `passed:` among them because the home-dir verdict prints near the end but
      # not at it, and a hand-off that died between the two would still carry it.
      # Each findstr carries its own `|| exit /b 1`: under `shell: cmd` only the
      # LAST command's exit code reaches the step.
      - name: Windows verifier entry point (verify.bat)
        shell: cmd
        env:
          OSO_VERIFY_SKIP_SLOW: 1
          HOME: C:\oso-code-decoy-home
        run: |
          call bootstrap\verify.bat > verify-bat-report.txt 2>&1
          type verify-bat-report.txt
          findstr /c:"ok:   home dir the Windows client reads" verify-bat-report.txt >nul || exit /b 1
          findstr /b /c:"passed:" verify-bat-report.txt >nul || exit /b 1
