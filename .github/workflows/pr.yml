name: pr

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck the core workspace
        run: npm run typecheck
      - name: Core unit tests
        run: npm test
      - name: Confirm the committed oso-state bundle matches source
        run: npm run check
      - name: Shell script syntax
        shell: bash
        run: |
          bash -n bootstrap/*.sh
          bash -n tools/*.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/git-hooks/pre-commit
          bash -n tests/*.sh tests/fixtures/*.sh
      - name: Plugin linter
        shell: bash
        run: bash tests/plugin-lint.sh
      - name: OpenCode unit suite (ubuntu only — Windows bring-up is C3's, tracked in docs/rewrite/ts-core-roadmap.md)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd opencode
          npm test
      - name: Install Claude Code CLI (ubuntu only — feeds the two validate steps below)
        if: runner.os == 'Linux'
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest (ubuntu only)
        if: runner.os == 'Linux'
        run: claude plugin validate --strict plugin
      - name: Validate marketplace manifest (ubuntu only)
        if: runner.os == 'Linux'
        run: claude plugin validate --strict .
