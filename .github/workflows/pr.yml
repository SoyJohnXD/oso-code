name: pr

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Shell script syntax
        run: |
          bash -n bootstrap/*.sh
          bash -n bootstrap/lib/*.sh
          bash -n tools/*.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/*.sh tests/fixtures/*.sh
      - name: Plugin linter
        run: bash tests/plugin-lint.sh
      - name: OpenCode unit suite
        run: |
          cd opencode
          npm ci --no-audit --no-fund
          npm test
      - name: Hook regression suite
        run: tests/hooks-test.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        run: claude plugin validate --strict plugin
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .
