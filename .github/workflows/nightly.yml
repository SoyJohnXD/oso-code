name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  VERIFY_CHECK_NAMES: |
    oso-code plugin installed
    engram MCP connected
    context7 MCP connected
    fallow MCP connected
    legacy artifacts removed
    settings.json free of gentle hooks
    CLAUDE.md under budget
    plugin install path found
    OSO_STATE_BIN round-trips oso-state (e2e)
    impeccable plugin installed
    shipped executables carry no CR bytes
  VERIFY_CHECK_NAMES_WINDOWS: |
    home dir the Windows client reads
    engram binary the client resolves and runs

jobs:
  nightly-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook regression suite on bash 3.2, which carries neither git nor jq
        run: docker run --rm -v "$PWD":/repo -w /repo bash:3.2 bash tests/hooks-test.sh
      - name: Verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SLOW: 1
        run: |
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          printf '%s' "$VERIFY_CHECK_NAMES" | LC_ALL=C sort > "$report.pinned"
          bash tools/verify-check-names.sh "$report" > "$report.reached"
          diff "$report.pinned" "$report.reached"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "9" ]
      - name: Codex verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SMOKE: 1
        run: |
          report="$(mktemp)"
          fixture_home="$(mktemp -d)"
          HOME="$fixture_home" CODEX_HOME="$fixture_home/.codex" \
            bash bootstrap/verify-codex.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "14" ]
      - name: OpenCode verify report reaches its summary
        env:
          OSO_VERIFY_SKIP_SMOKE: 1
        run: |
          cd opencode
          npm ci --no-audit --no-fund
          cd ..
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify-opencode.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          passed="$(sed -n 's/^passed: \([0-9]*\), failed: [0-9]*$/\1/p' "$report")"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$passed" = "16" ]
          [ "$failed" = "0" ]
      - name: Pinned OpenCode binary the contract and behavior bars introspect
        run: |
          pin="$(sed -n 's/^SUPPORTED_OPENCODE_VERSION=//p' bootstrap/install-opencode.sh | head -1)"
          mkdir -p "$RUNNER_TEMP/opencode-pin"
          cd "$RUNNER_TEMP/opencode-pin"
          npm pack "opencode-linux-x64@$pin"
          tar -xf "opencode-linux-x64-$pin.tgz"
          echo "OSO_PINNED_OPENCODE_BIN=$RUNNER_TEMP/opencode-pin/package/bin/opencode" >> "$GITHUB_ENV"
      - name: OpenCode contract bar against the pinned binary
        env:
          OSO_CONTRACT_BAR_OPENCODE_BIN: ${{ env.OSO_PINNED_OPENCODE_BIN }}
        run: bash tests/opencode-contract-bar.sh
      - name: OpenCode behavior bar, where a red assertion fails the tree and only its own not-run lane is tolerated
        env:
          OSO_BEHAVIOR_BAR_OPENCODE_BIN: ${{ env.OSO_PINNED_OPENCODE_BIN }}
        run: |
          status=0
          bash tests/opencode-behavior-bar.sh || status=$?
          [ "$status" = 3 ] || exit "$status"
          echo "::warning::the behavior bar drove no gated tool call this run, so it asserted nothing about the boundaries; every check it did reach was green"
      - name: Open an issue for this failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "nightly / nightly-ubuntu failed" \
            --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  nightly-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22, the floor install.ps1 enforces
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Provision jq for the suite
        shell: bash
        run: |
          command -v jq >/dev/null 2>&1 || choco install jq --no-progress -y
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          jq --version
      - name: Hook regression suite
        shell: bash
        run: |
          jq --version
          bash tests/hooks-test.sh
      - name: Shell script syntax
        shell: bash
        run: |
          bash -n bootstrap/*.sh
          bash -n bootstrap/lib/*.sh
          bash -n tools/*.sh
          bash -n plugin/hooks/*.sh
          bash -n plugin/bin/oso-state plugin/git-hooks/pre-commit
          bash -n tests/*.sh tests/fixtures/*.sh
      - name: PowerShell script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path .\bootstrap\install.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 parses clean ($($tokens.Count) tokens)"
      - name: Bootstrapper (CI-safe mode)
        shell: powershell
        run: .\bootstrap\install.ps1 -CiMode -Yes -ReplaceClaudeMd -NoImpeccable -NoGitHook
      - name: Verify report reaches its summary
        shell: bash
        env:
          OSO_VERIFY_SKIP_SLOW: 1
        run: |
          report="$(mktemp)"
          HOME="$(mktemp -d)" bash bootstrap/verify.sh > "$report" 2>&1 || true
          cat "$report"
          grep -q '^passed:' "$report"
          printf '%s%s' "$VERIFY_CHECK_NAMES" "$VERIFY_CHECK_NAMES_WINDOWS" |
            LC_ALL=C sort > "$report.pinned"
          bash tools/verify-check-names.sh "$report" > "$report.reached"
          diff "$report.pinned" "$report.reached"
          failed="$(sed -n 's/^passed: [0-9]*, failed: \([0-9]*\)$/\1/p' "$report")"
          [ "$failed" = "11" ]
      - name: Windows verifier entry point (verify.bat)
        shell: cmd
        env:
          OSO_VERIFY_SKIP_SLOW: 1
          HOME: C:\oso-code-decoy-home
        run: |
          call bootstrap\verify.bat > verify-bat-report.txt 2>&1
          type verify-bat-report.txt
          findstr /c:"ok:   home dir the Windows client reads" verify-bat-report.txt >nul || exit /b 1
          findstr /b /c:"passed:" verify-bat-report.txt >nul || exit /b 1
      - name: Open an issue for this failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "nightly / nightly-windows failed" \
            --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
